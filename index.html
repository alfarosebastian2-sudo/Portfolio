<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio |Técnico Administrador de Sistemas Informáticos en Red</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --green: #7ee787;
      --yellow: #f1e05a;
      --dim: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .terminal {
      width: 100%;
      max-width: 860px;
      height: 80vh;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background-color: #21262d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--dim);
    }

    .window-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .btn-red { background-color: #ff5f56; }
    .btn-yellow { background-color: #ffbd2e; }
    .btn-green { background-color: #27c93f; }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background-color: #12161c;
      border-bottom: 1px solid var(--border);
    }

    .action-chip {
      background-color: #21262d;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .action-chip:hover {
      background-color: var(--accent);
      color: #0d1117;
    }

    .terminal-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .output-block {
      margin-bottom: 16px;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt {
      color: var(--green);
      font-weight: bold;
    }

    .prompt-path {
      color: var(--accent);
    }

    .command-input {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      flex: 1;
    }

    .card {
      background-color: #0d1117;
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 0 6px 6px 0;
    }

    .card h4 {
      color: var(--yellow);
      margin-bottom: 4px;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="terminal-header">
      <div class="window-buttons">
        <span class="btn-circle btn-red"></span>
        <span class="btn-circle btn-yellow"></span>
        <span class="btn-circle btn-green"></span>
      </div>
      <div>terminal-perfil@cv-online: ~</div>
      <div>bash</div>
    </div>

    <div class="quick-actions">
      <span style="font-size: 0.8rem; line-height: 26px; color: var(--dim);">Clic rápido:</span>
      <button class="action-chip" onclick="execCmd('sobremi')">sobremi</button>
      <button class="action-chip" onclick="execCmd('experiencia')">experiencia</button>
      <button class="action-chip" onclick="execCmd('intereses')">intereses-tecnicos</button>
      <button class="action-chip" onclick="execCmd('contacto')">contacto</button>
      <button class="action-chip" onclick="execCmd('clear')">limpiar</button>
    </div>

    <div class="terminal-body" id="terminal-body">
      <div class="output-block">
        <p style="color: var(--yellow);">Sesión interactiva iniciada.</p>
        <p>Portfolio interactivo para posiciones de Soporte, Infraestructura e IT.</p>
        <p style="color: var(--dim);">Escribe <span style="color: var(--green);">help</span> o haz clic en los botones superiores para e
      </div>
    </div>

    <div style="padding: 12px 16px; background-color: #12161c; border-top: 1px solid var(--border);">
      <div class="prompt-line">
        <span class="prompt">reclutador@portfolio</span>:<span class="prompt-path">~</span>$
        <input type="text" id="cli-input" class="command-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <script>
    const cliInput = document.getElementById('cli-input');
    const terminalBody = document.getElementById('terminal-body');

    const commands = {
      help: `
Comandos disponibles:
  <span style="color: var(--green);">sobremi</span>      - Quién soy, formación y qué puesto busco.
  <span style="color: var(--green);">experiencia</span>  - Habilidades reales de mi trabajo actual aplicadas a IT.
  <span style="color: var(--green);">intereses</span>    - Qué áreas técnicas estoy aprendiendo por mi cuenta.
  <span style="color: var(--green);">contacto</span>     - Enlace a mi LinkedIn y correo de contacto.
  <span style="color: var(--green);">clear</span>        - Limpia la pantalla.
      `,
      sobremi: `
<div class="card">
  <h4>Perfil & Formación</h4>
  <p><strong>Formación:</strong> Bachillerato de Ciencias Sociales.</p>
  <p><strong>Situación actual:</strong> Actualmente curso el segundo año de Administración de Sistemas Informáticos en Red. Entre mis habilidades destacan la resolución de problemas, adaptabilidad y trabajo en equipo. Busco incorporarme a una empresa dónde pueda aportar mis conocimientos al igual que crecer profesionalmente.</p>
  <p><strong>Puntos fuertes:</strong> Autonomía para aprender, resolución metódica de problemas, trato directo con personas bajo presión y constancia laboral demostrable.</p>
</div>
      `,
     experiencia: `
<div class="card">
  <h4>Teleoperador en VPLAT | Competencias Laborales Aplicadas</h4>
  <p>Mi experiencia profesional activa aporta habilidades prácticas clave para el entorno IT:</p>
  <p>• <strong>Resolución de incidencias en tiempo real:</strong> Diagnóstico de problemas, aplicación ágil de soluciones y cumplimiento de procedimientos operativos.</p>
  <p>• <strong>Comunicación y trato con usuarios:</strong> Capacidad de transmitir información y pasos técnicos de forma clara y accesible.</p>
  <p>• <strong>Gestión bajo objetivos y presión:</strong> Hábito demostrado de cumplir horarios, métricas de servicio y altos estándares de atención.</p>
  <p>• <strong>Curva de aprendizaje rápida:</strong> Facilidad demostrada para adaptarme con rapidez a nuevos entornos de software corporativo y herramientas internas.</p>
</div>
      `,
      intereses: `
<div class="card">
  <h4>Fundamentos Técnicos en Aprendizaje Continuo</h4>
  <p>Conocimientos teóricos y prácticos que estoy desarrollando de forma autodidacta:</p>
  <p>• <strong>Redes:</strong> Entendimiento del modelo TCP/IP, direccionamiento IPv4, funcionamiento de DNS, DHCP, routers y switches domésticos/básicos.</p>
  <p>• <strong>Sistemas Operativos:</strong> Configuración y solución de problemas en Windows a nivel avanzado; uso de línea de comandos básica y familiarización con distribuciones Linux (Ubuntu/Debian).</p>
  <p>• <strong>Bases de Datos & Lógica:</strong> Comprensión básica de bases de datos relacionales (tablas, claves y consultas básicas SELECT) y fundamentos de organización de datos.</p>
  <p>• <strong>Seguridad Básica:</strong> Principios de contraseñas seguras, copias de seguridad (backups), permisos de usuarios y buenas prácticas para evitar malware/phishing.</p>
</div>
      `,
     contacto: `
<div class="card">
  <h4>Contacto</h4>
  <p>• <strong>Email:</strong> <a href="mailto:alfarosebastian2@gmail.com">alfarosebastian2@gmail.com</a></p>
  <p>• <strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/sebastian-alfaro-602b93386" target="_blank" rel="noopener noreferrer">linkedin.com/in/sebastian-alfaro-602b93386</a></p>
</div>
      `
    };

    function printCommand(cmd) {
      const line = document.createElement('div');
      line.className = 'prompt-line';
      line.innerHTML = `<span class="prompt">reclutador@portfolio</span>:<span class="prompt-path">~</span>$ <span style="color:#fff; font-weight:bold;">${cmd}</span>`;
      terminalBody.appendChild(line);
    }

    function execCmd(rawCmd) {
      const cmd = rawCmd.trim().toLowerCase();
      printCommand(cmd);

      if (cmd === 'clear' || cmd === 'limpiar') {
        terminalBody.innerHTML = '';
      } else if (commands[cmd]) {
        const out = document.createElement('div');
        out.className = 'output-block';
        out.innerHTML = commands[cmd];
        terminalBody.appendChild(out);
      } else if (cmd === 'intereses-tecnicos') {
        const out = document.createElement('div');
        out.className = 'output-block';
        out.innerHTML = commands['intereses'];
        terminalBody.appendChild(out);
      } else if (cmd !== '') {
        const out = document.createElement('div');
        out.className = 'output-block';
        out.innerHTML = `<span style="color: #ff5f56;">Comando no reconocido: "${cmd}". Escribe <span style="color: var(--green);">help</span> para ver los comandos válidos.</span>`;
        terminalBody.appendChild(out);
      }

      terminalBody.scrollTop = terminalBody.scrollHeight;
      cliInput.value = '';
    }

    cliInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        execCmd(cliInput.value);
      }
    });

    document.querySelector('.terminal').addEventListener('click', () => {
      cliInput.focus();
    });
  </script>
</body>
</html>
